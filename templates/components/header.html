<header class="dashboard-navbar">
  <div class="navbar-container">
    <div class="navbar-left">
      <button
        type="button"
        id="btn-sidebar-toggle"
        class="btn-sidebar-toggle"
        title="Toggle navigation sidebar"
        aria-label="Toggle Sidebar"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="navbar-heading-group">
        <!-- Standard View Kicker Tag (Overview / Census / Governance) -->
        <span class="navbar-kicker" id="navbar-view-tag">Executive Summary</span>

        <!-- Commodity Breadcrumb Trail (Shown only on Commodity Detail view) -->
        <nav class="navbar-breadcrumb-trail" id="navbar-commodity-breadcrumb" aria-label="Breadcrumb" style="display: none;">
          <button type="button" class="breadcrumb-link" data-nav-view="overview">Market Overview</button>
          <span class="breadcrumb-sep">/</span>
          <span id="breadcrumb-group">Rice</span>
          <span class="breadcrumb-sep">/</span>
          <strong id="breadcrumb-commodity">{{ default_commodity }}</strong>
        </nav>

        <div class="navbar-title-row">
          <h1 class="navbar-title" id="navbar-view-title">Market Overview</h1>
        </div>
      </div>
    </div>

    <div class="navbar-right">
      <!-- Commodity Navigation Controls (Shown only on Commodity Detail view) -->
      <div class="navbar-commodity-controls" id="navbar-commodity-controls" style="display: none;">
        <div class="commodity-stepper-group" role="group" aria-label="Step through commodities">
          <button type="button" id="btn-prev-commodity" class="btn-step-commodity" title="Previous commodity">
            ← Prev
          </button>
          <span class="stepper-divider" aria-hidden="true"></span>
          <button type="button" id="btn-next-commodity" class="btn-step-commodity" title="Next commodity">
            Next →
          </button>
        </div>

        <select id="commodity-picker" class="navbar-commodity-select" aria-label="Quick switch commodity">
          {% for grp, items in commodities_by_group.items() %}
          <optgroup label="{{ grp }}">
            {% for item in items %}
            <option value="{{ item.commodity }}" {% if item.commodity == default_commodity %}selected{% endif %}>
              {{ item.commodity }} ({{ item.unit }})
            </option>
            {% endfor %}
          </optgroup>
          {% endfor %}
        </select>
      </div>

      <div class="navbar-date-badge">
        <span class="date-lbl">Latest:</span>
        <strong class="date-val">{{ kpis.latest_date_short }}</strong>
      </div>

      <button
        type="button"
        class="btn-navbar-action btn-print btn-icon-only"
        onclick="window.print()"
        title="Print Bulletin (Save as PDF)"
        aria-label="Print Bulletin"
      >
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
      </button>
    </div>
  </div>
</header>
