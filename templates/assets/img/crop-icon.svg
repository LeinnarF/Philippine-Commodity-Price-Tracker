<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Minimalist Forest Green Canvas -->
  <rect width="512" height="512" rx="112" fill="#064e3b"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Base Foundation Line -->
    <line x1="200" y1="384" x2="312" y2="384" stroke="#ffffff" stroke-width="16"/>

    <!-- Central Pillar -->
    <line x1="256" y1="384" x2="256" y2="216" stroke="#ffffff" stroke-width="16"/>

    <!-- Horizontal Balance Beam -->
    <line x1="116" y1="216" x2="396" y2="216" stroke="#ffffff" stroke-width="16"/>

    <!-- Left Pan Suspension Lines -->
    <line x1="116" y1="216" x2="80" y2="300" stroke="#ffffff" stroke-width="10" stroke-opacity="0.9"/>
    <line x1="116" y1="216" x2="152" y2="300" stroke="#ffffff" stroke-width="10" stroke-opacity="0.9"/>
    <!-- Left Pan Bowl (Smooth Parabolic Cradle) -->
    <path d="M 68,300 Q 116,356 164,300 Z" fill="#f59e0b"/>

    <!-- Right Pan Suspension Lines -->
    <line x1="396" y1="216" x2="360" y2="300" stroke="#ffffff" stroke-width="10" stroke-opacity="0.9"/>
    <line x1="396" y1="216" x2="432" y2="300" stroke="#ffffff" stroke-width="10" stroke-opacity="0.9"/>
    <!-- Right Pan Bowl (Smooth Parabolic Cradle) -->
    <path d="M 348,300 Q 396,356 444,300 Z" fill="#f59e0b"/>

    <!-- Central Fulcrum Ring & Upward Indicator Arrow -->
    <circle cx="256" cy="216" r="30" fill="#064e3b" stroke="#ffffff" stroke-width="14"/>
    <circle cx="256" cy="216" r="12" fill="#f59e0b"/>
    <!-- Upward Trend Indicator Arrow -->
    <polygon points="256,128 274,180 238,180" fill="#f59e0b" stroke="#f59e0b" stroke-width="4"/>
  </g>
</svg>
