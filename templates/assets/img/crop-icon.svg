<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Minimalist Deep Forest Green Canvas -->
  <rect width="512" height="512" rx="112" fill="#064e3b"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Baseline Axis -->
    <line x1="104" y1="392" x2="408" y2="392" stroke="#ffffff" stroke-width="16" stroke-opacity="0.9"/>

    <!-- Bar 1 (Short: 45% Translucent White) -->
    <rect x="128" y="280" width="56" height="112" rx="20" fill="#ffffff" fill-opacity="0.45"/>

    <!-- Bar 2 (Medium: 75% Translucent White) -->
    <rect x="228" y="208" width="56" height="184" rx="20" fill="#ffffff" fill-opacity="0.8"/>

    <!-- Bar 3 (Tall: 100% Solid Crisp White) -->
    <rect x="328" y="136" width="56" height="256" rx="20" fill="#ffffff"/>

    <!-- Sweeping Solid White Trendline Curve -->
    <path d="M 120,312 Q 220,260 256,180 T 384,104" fill="none" stroke="#ffffff" stroke-width="20"/>

    <!-- Terminal Trend Node (White with Forest Green Core) -->
    <circle cx="390" cy="100" r="24" fill="#064e3b" stroke="#ffffff" stroke-width="8"/>
    <circle cx="390" cy="100" r="10" fill="#ffffff"/>
  </g>
</svg>
