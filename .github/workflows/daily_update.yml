name: Scheduled Daily Price Sync & Pages Deployment

# CEASED FOR NOW: Automated daily collector and Pages sync are disabled
# pending resolution of PDF bulletin data extraction issues.
on:
  workflow_dispatch:
#  schedule:
#    # Runs Monday to Saturday at 10:00 UTC (18:00 Manila Time - PHT), shortly after DA AMAS publishes bulletins
#    - cron: '0 10 * * 1-6'
#    # Secondary check at 14:00 UTC (22:00 Manila Time - PHT) to catch late-afternoon bulletin uploads
#    - cron: '0 14 * * 1-6'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pipeline"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    # Ceased: Automated daily sync and deployments stopped for now
    if: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated test suite
        run: |
          python -m pytest tests/ -v

      - name: Run incremental daily price update
        run: |
          python -m pipeline.daily_update --trigger ${{ github.event_name }} --rebuild

      - name: Commit updated datasets and execution logs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clean_da_amas_prices.csv data/selected_da_amas_prices.csv data/raw_da_amas_prices.csv data/pipeline_execution_logs.csv
          git diff --staged --quiet || (git commit -m "chore(data): auto-update daily DA AMAS prices and execution logs [skip ci]" && git push)

