name: Scheduled Daily Price Sync & Pages Deployment

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 10:00 UTC (18:00 Manila Time - PHT), shortly after DA AMAS publishes bulletins
    - cron: '0 10 * * *'
    # Secondary check daily at 14:00 UTC (22:00 Manila Time - PHT) to catch late-afternoon bulletin uploads
    - cron: '0 14 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pipeline"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt --system --break-system-packages

      - name: Run automated test suite
        run: |
          python -m pytest tests/ -v

      - name: Run incremental daily price update
        run: |
          python -m pipeline.daily_update --trigger ${{ github.event_name }} --rebuild

      - name: Commit updated datasets and execution logs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cleaned_dataset.csv data/server_daily_bulletins.csv data/pipeline_execution_logs.csv
          git diff --staged --quiet || (git commit -m "chore(data): auto-update daily DA AMAS prices and execution logs [skip ci]" && git push)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
