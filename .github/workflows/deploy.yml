name: Deploy Dashboard to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      sync_databricks:
        description: "Sync DuckDB warehouse to Databricks Unity Catalog"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - incremental
          - full
  push:
    branches:
      - main
      - feat/databricks-integration

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt

      - name: Build DuckDB analytical warehouse (Stage 5)
        run: |
          uv run python -m pipeline.load_duckdb

      - name: Run automated test suite
        run: |
          uv run python -m pytest tests/ -v

      - name: Generate static dashboard bundle (Stage 6)
        run: |
          uv run python -m pipeline.build_dashboard

      - name: Sync warehouse to Databricks Unity Catalog (branch test or manual trigger)
        if: >-
          (github.event_name == 'workflow_dispatch' && (inputs.sync_databricks == 'incremental' || inputs.sync_databricks == 'full')) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/feat/databricks-integration')
        continue-on-error: true
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
          DATABRICKS_SCHEMA: ${{ secrets.DATABRICKS_SCHEMA }}
        run: |
          MODE="${{ inputs.sync_databricks }}"
          if [ -z "$MODE" ] || [ "$MODE" = "none" ]; then
            MODE="incremental"
          fi
          uv run python -m pipeline.sync_databricks --mode "$MODE" --skip-if-unconfigured

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
