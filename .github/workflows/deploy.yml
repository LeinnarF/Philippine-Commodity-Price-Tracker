name: Deploy Dashboard to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt

      - name: Build DuckDB analytical warehouse (Stage 5)
        run: |
          uv run python -m pipeline.load_duckdb

      - name: Run automated test suite
        run: |
          uv run python -m pytest tests/ -v

      - name: Generate static dashboard bundle (Stage 6)
        run: |
          uv run python -m pipeline.build_dashboard

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
